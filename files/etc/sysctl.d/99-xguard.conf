# Memory-friendly settings for a 128 MB router running xray from RAM.

# conntrack entries cost ~300 B each: cap the table and expire things quickly
net.netfilter.nf_conntrack_max=8192
net.netfilter.nf_conntrack_tcp_timeout_established=3600
net.netfilter.nf_conntrack_udp_timeout=20
net.netfilter.nf_conntrack_udp_timeout_stream=60
net.netfilter.nf_conntrack_generic_timeout=60

# prefer compressing cold pages into zram over dropping page cache
vm.swappiness=100
vm.vfs_cache_pressure=150
vm.min_free_kbytes=4096
vm.overcommit_memory=0

# needed for tproxy / transparent redirect of forwarded traffic
net.ipv4.ip_forward=1
net.ipv4.conf.all.route_localnet=1
