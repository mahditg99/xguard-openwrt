<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xguard</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--fg:#17202e;--mut:#64708a;--bd:#e0e5ec;--ac:#0d9488;--ac2:#0f766e;--acs:#e6f6f4;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--r:14px;--sh:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1218;--card:#161d27;--fg:#e8ecf2;--mut:#8b98ad;--bd:#243040;--ac:#2dd4bf;--ac2:#14b8a6;--acs:#12302f;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--sh:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.2)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 Vazirmatn,"Segoe UI",Tahoma,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;padding:.7rem 1.1rem;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
h1{font-size:1.1rem;margin:0;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:.55rem}
h1::before{content:"";width:1.5rem;height:1.5rem;border-radius:7px;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:inset 0 0 0 5px color-mix(in srgb,#fff 25%,transparent)}
.pill{display:inline-flex;align-items:center;gap:.4rem;padding:.12rem .75rem;border-radius:99px;font-size:.84rem;font-weight:500;border:1px solid var(--bd);color:var(--mut);background:var(--card)}
.pill::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:currentColor}
.pill.running{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--bd))}
.pill.running::before{box-shadow:0 0 0 0 currentColor;animation:pl 2.4s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}70%,100%{box-shadow:0 0 0 6px transparent}}
@media (prefers-reduced-motion:reduce){.pill.running::before{animation:none}}
.pill.degraded,.pill.starting,.pill.restarting,.pill.fetching-xray,.pill.updating{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--bd))}
.pill.disabled{color:var(--mut)}.pill.need-xray,.pill.error,.pill.no-node{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--bd))}
#enabled{appearance:none;-webkit-appearance:none;width:2.4rem;height:1.35rem;padding:0;border-radius:99px;background:var(--bd);border:0;position:relative;cursor:pointer;transition:background .2s;vertical-align:middle;margin-inline-start:.3rem}
#enabled::after{content:"";position:absolute;top:.15rem;inset-inline-start:.15rem;width:1.05rem;height:1.05rem;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:inset-inline-start .2s}
#enabled:checked{background:var(--ac)}#enabled:checked::after{inset-inline-start:1.2rem}
nav{display:flex;gap:.3rem;padding:.7rem 1rem 0;max-width:980px;margin:0 auto;overflow-x:auto}
nav button{background:none;border:0;border-radius:99px;color:var(--mut);padding:.4rem 1rem;font:inherit;font-size:.92rem;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
nav button:hover{background:color-mix(in srgb,var(--ac) 8%,transparent);color:var(--fg)}
nav button.on{background:var(--acs);color:var(--ac2);font-weight:600}
@media (prefers-color-scheme:dark){nav button.on{color:var(--ac)}}
main{max-width:980px;margin:0 auto;padding:1rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:1.1rem 1.2rem;margin-bottom:1rem;box-shadow:var(--sh)}
.sect{border:1px solid var(--bd);border-radius:12px;padding:.8rem 1rem 1rem;margin:.9rem 0;background:color-mix(in srgb,var(--bg) 55%,var(--card))}
.sect-t{font-weight:600;margin-bottom:.7rem;padding-bottom:.4rem;border-bottom:1px solid var(--bd);color:var(--ac2)}
@media (prefers-color-scheme:dark){.sect-t{color:var(--ac)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem}
.tile{background:var(--bg);border-radius:11px;padding:.65rem .85rem}
.k{color:var(--mut);font-size:.78rem}.v{font-size:1.1rem;font-weight:600;direction:ltr;text-align:right;word-break:break-all}
button.b,select,input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:.42rem .7rem;transition:border-color .15s,box-shadow .15s,background .15s}
select,input:not([type=checkbox]):not([type=radio]),textarea{max-width:100%}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
button:focus-visible,#enabled:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input[type=checkbox],input[type=radio]{accent-color:var(--ac)}
button.b{cursor:pointer;background:var(--ac);color:#fff;border-color:var(--ac);font-weight:500}button.b:hover{background:var(--ac2);border-color:var(--ac2)}
@media (prefers-color-scheme:dark){button.b{color:#06201e}}
button.b.sec{background:none;color:var(--fg);border-color:var(--bd)}button.b.sec:hover{background:var(--bg);border-color:var(--mut)}
button.b.del{background:none;color:var(--bad);border-color:var(--bd)}button.b.del:hover{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:var(--bad)}
textarea{width:100%;min-height:5.5rem;direction:ltr;font-family:ui-monospace,Consolas,monospace;font-size:.85rem}
input.ltr,select.ltr,textarea.ltr{direction:ltr;text-align:left}
table{width:100%;border-collapse:collapse}th,td{padding:.5rem .35rem;border-bottom:1px solid var(--bd);text-align:right;vertical-align:middle}tr:last-child td{border-bottom:0}th{color:var(--mut);font-weight:500;font-size:.78rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.4rem 0}
.hint{color:var(--mut);font-size:.82rem}
label.f{display:block;margin:.55rem 0 .2rem;color:var(--mut);font-size:.84rem}
#msg{position:fixed;bottom:1rem;inset-inline:1rem;max-width:560px;margin:auto;padding:.7rem 1rem;border-radius:12px;background:var(--card);border:1px solid var(--bd);box-shadow:0 8px 28px rgba(0,0,0,.18);display:none;z-index:9}
#login{position:fixed;inset:0;background:radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--ac) 14%,var(--bg)),var(--bg) 60%);display:flex;align-items:center;justify-content:center;z-index:20}
#login .card{padding:1.6rem 1.4rem}#login h1{font-size:1.3rem;margin-bottom:.3rem}
pre{direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-all;font-size:.78rem;background:var(--bg);padding:.8rem;border-radius:10px;max-height:22rem;overflow:auto}
.mono{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Consolas,monospace;font-size:.85rem}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin:.25rem 0;min-width:7rem}.bar>i{display:block;height:100%;background:var(--ac);border-radius:9px}.bar.hot>i{background:var(--warn)}.bar.over>i{background:var(--bad)}
td .hint{margin:0}
</style>
</head>
<body>
<div id="login"><div class="card" style="width:min(92vw,340px)">
  <h1>xguard</h1><p class="hint">ورود با رمز root روتر</p>
  <input id="pw" type="password" class="ltr" style="width:100%" placeholder="password (can be empty)" autocomplete="current-password">
  <div class="row"><button class="b" id="loginbtn">ورود</button><span id="lerr" class="hint" style="color:var(--bad)"></span></div>
</div></div>

<header>
  <h1>xguard</h1><span id="pill" class="pill">…</span><span id="hnode" class="hint mono"></span>
  <span style="flex:1"></span>
  <label class="row" style="margin:0"><input type="checkbox" id="enabled"> فعال</label>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="msg"></div>

<script>
'use strict';
// replaced by the package build (tools/build-ipk.sh); stays as is in a checkout
const BUILD = '__BUILD__';
const $ = (s, e) => (e || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if (k === 'value') e.value = attrs[k];
    else if (k === 'checked') e.checked = !!attrs[k];
    else if (k === 'selected' || k === 'disabled') e[k] = !!attrs[k];   // setAttribute('selected', false) would still select
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}

// ---- ubus ----------------------------------------------------------------
// opened from LuCI (Services -> xguard VPN): "#sid=<LuCI session>" avoids a second login
try {
  const hm = /^#sid=([0-9a-f]{32})$/.exec(location.hash);
  if (hm) { sessionStorage.setItem('xg_sid', hm[1]); history.replaceState(null, '', location.pathname + location.search); }
} catch (e) {}
let sid = sessionStorage.getItem('xg_sid') || '00000000000000000000000000000000';
async function rpc(obj, method, params) {
  const r = await fetch('/ubus', { method: 'POST', body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'call', params: [sid, obj, method, params || {}] }) });
  const j = await r.json();
  if (j.error) throw new Error(j.error.message);
  const [code, data] = j.result;
  if (code === 6) { showLogin(); throw new Error('access denied'); }
  if (code !== 0) throw new Error('ubus error ' + code);
  return data;
}
const xg = (m, p) => rpc('xguard', m, p);
async function login(pw) {
  const r = await fetch('/ubus', { method: 'POST', body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'call', params: ['00000000000000000000000000000000', 'session', 'login', { username: 'root', password: pw }] }) });
  const j = await r.json();
  if (!j.result || j.result[0] !== 0) throw new Error('رمز اشتباه است');
  sid = j.result[1].ubus_rpc_session; sessionStorage.setItem('xg_sid', sid);
}
function showLogin() { $('#login').style.display = 'flex'; }

let mt;
function say(t, bad) {
  const m = $('#msg'); m.textContent = t; m.style.display = 'block'; m.style.borderColor = bad ? 'var(--bad)' : 'var(--bd)';
  clearTimeout(mt); mt = setTimeout(() => m.style.display = 'none', bad ? 7000 : 3000);
}

// ---- state ----------------------------------------------------------------
let cfg = null, st = null, dev = null, tab = 'status', dirty = false, editing = -1;
const TABS = [['status', 'وضعیت'], ['usage', 'مصرف'], ['nodes', 'نودها'], ['net', 'شبکه و دستگاه‌ها'], ['limits', 'محدودیت و سهمیه'], ['settings', 'تنظیمات'], ['logs', 'لاگ']];
const fmt = n => { n = +n || 0; const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return n.toFixed(i ? 1 : 0) + ' ' + u[i]; };
const kb = n => fmt((+n || 0) * 1024);
const dur = s => { s = +s || 0; const d = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return (d ? d + 'd ' : '') + (hh ? hh + 'h ' : '') + m + 'm'; };
const STATUS_FA = { running: 'متصل', degraded: 'قطع (kill-switch فعال)', starting: 'در حال اتصال', restarting: 'ری‌استارت', disabled: 'غیرفعال', 'fetching-xray': 'دانلود xray', 'need-xray': 'xray موجود نیست', 'no-node': 'نود ندارد', updating: 'به‌روزرسانی xray', error: 'خطا' };

async function load() {
  [cfg, st, dev] = await Promise.all([xg('get_config'), xg('status'), xg('devices')]);
  cfg.quotas = cfg.quotas || [];
  cfg.block = cfg.block || [];
  $('#enabled').checked = cfg.main.enabled === '1';
  editing = -1;
  paintHead(); render();
}
function paintHead() {
  const s = (st.state && st.state.status) || (st.enabled ? 'starting' : 'disabled');
  const p = $('#pill'); p.className = 'pill ' + s; p.textContent = STATUS_FA[s] || s;
  const n = st.nodes.find(x => x.id === (st.state && st.state.node));
  $('#hnode').textContent = n ? n.name : '';
}
async function refresh() {
  try { st = await xg('status'); paintHead(); if (tab === 'status') render(); if (tab === 'logs') loadLogs(); if (tab === 'usage' && !uDay && U) loadUsage(); } catch (e) { }
}

async function save(okmsg) {
  try {
    const r = await xg('save_config', { config: cfg });
    if (r.error) { say(r.error, true); return false; }
    dirty = false; say(okmsg || 'ذخیره شد'); await load(); return true;
  } catch (e) { say(e.message, true); return false; }
}
$('#enabled').addEventListener('change', async e => {
  cfg.main.enabled = e.target.checked ? '1' : '0';
  if (e.target.checked && !cfg.nodes.length) { say('ابتدا یک نود اضافه کنید', true); e.target.checked = false; cfg.main.enabled = '0'; return; }
  if (e.target.checked && !protects() && !confirm('هیچ اینترفیس یا دستگاهی روی VPN تنظیم نشده. ادامه می‌دهید؟')) { e.target.checked = false; cfg.main.enabled = '0'; return; }
  await save(e.target.checked ? 'فعال شد (kill-switch برقرار است)' : 'غیرفعال شد');
});

// ---- tabs ----------------------------------------------------------------
function drawNav() {
  const n = $('#nav'); n.innerHTML = '';
  for (const [id, t] of TABS) n.append(h('button', { class: id === tab ? 'on' : '', onclick: () => { tab = id; drawNav(); render(); } }, t));
}
function render() {
  const m = $('#main'); m.innerHTML = '';
  ({ status: vStatus, usage: vUsage, nodes: vNodes, net: vNet, limits: vLimits, settings: vSettings, logs: vLogs })[tab](m);
}
const saveBar = () => h('div', { class: 'row' }, h('button', { class: 'b', onclick: () => save() }, 'ذخیره و اعمال'));

function vStatus(m) {
  const s = st.state || {};
  if (cfg.main.enabled === '1' && !protects())
    m.append(h('div', { class: 'card', style: 'border-color:var(--bad)' }, h('b', { style: 'color:var(--bad)' }, 'هشدار: هیچ اینترفیسی روی «VPN» نیست'), h('p', { class: 'hint' }, 'برنامه روشن است ولی همهٔ اینترفیس‌ها «دست‌نخورده/مستقیم»اند؛ پس ترافیک هیچ دستگاهی از VPN نمی‌گذرد و با نبودن xray هم قطع نمی‌شود (kill-switch فقط برای اینترفیس‌های VPN و مسدود است). در تب «شبکه» اینترفیس‌های دلخواه را روی VPN بگذارید. فقط DNS روتر از xray می‌گذرد.')));
  const cell = (k, v) => h('div', { class: 'tile' }, h('div', { class: 'k' }, k), h('div', { class: 'v' }, v));
  m.append(h('div', { class: 'card' }, h('div', { class: 'grid' },
    cell('وضعیت', STATUS_FA[s.status] || s.status || '—'),
    cell('تأخیر', s.alive === '1' ? s.delay + ' ms' : '—'),
    cell('آپلود / دانلود (از شروع xray)', fmt(s.up_bytes) + ' / ' + fmt(s.down_bytes)),
    cell('مدت اتصال xray', dur(s.uptime)),
    cell('تعداد ری‌استارت', s.restarts || 0),
    cell('RAM پروسهٔ xray', kb(s.rss_kb)),
    cell('RAM در دسترس', kb(st.mem_avail_kb) + ' / ' + kb(st.mem_total_kb)),
    cell('zram swap آزاد', st.swap_total_kb ? kb(st.swap_free_kb) + ' / ' + kb(st.swap_total_kb) : 'غیرفعال'),
    cell('نسخهٔ xray', (s.xray_version || '—').replace(/\s*\(.*$/, '')),
    cell('load', st.loadavg.split(' ').slice(0, 3).join(' '))
  ), s.msg ? h('p', { class: 'hint', style: 'color:var(--warn)' }, s.msg) : null));
  m.append(h('div', { class: 'card' },
    h('div', { class: 'row' },
      h('button', { class: 'b sec', onclick: () => cmd('restart') }, 'ری‌استارت xray'),
      h('button', { class: 'b sec', onclick: () => cmd('next') }, 'نود بعدی'),
      h('button', { class: 'b sec', onclick: () => confirm('xray از منبع تنظیم‌شده دوباره دانلود می‌شود. در این مدت kill-switch فعال می‌ماند.') && cmd('update-xray') }, 'به‌روزرسانی xray')),
    h('p', { class: 'hint' }, 'اگر اتصال قطع شود، دستگاه‌های روی VPN اینترنت مستقیم نخواهند داشت (kill-switch) و برنامه تا بی‌نهایت دوباره تلاش می‌کند.')));
}
async function cmd(c) { try { await xg('command', { cmd: c }); say('دستور ارسال شد'); setTimeout(refresh, 2500); } catch (e) { say(e.message, true); } }

// ---- node editor (form) ----------------------------------------------------------------
const FPS = ['chrome', 'firefox', 'safari', 'ios', 'android', 'edge', '360', 'qq', 'random', 'randomized'];
const getp = (o, p) => p.reduce((a, k) => (a == null ? undefined : a[k]), o);
const setp = (o, p, v) => {
  let a = o;
  for (let i = 0; i < p.length - 1; i++) { if (typeof a[p[i]] !== 'object' || a[p[i]] === null) a[p[i]] = {}; a = a[p[i]]; }
  const k = p[p.length - 1];
  if (v === '' || v === undefined || v === null || v === false) delete a[k]; else a[k] = v;
};
const isFrag = o => o && o.protocol === 'freedom' && o.settings && o.settings.fragment;
const KNOWN = ['vless', 'vmess', 'trojan', 'shadowsocks', 'socks'];
const SECTION_STYLE = 'margin:.9rem 0 .3rem;font-weight:600';

function nodeEditor(n) {
  const card = h('div', { class: 'card' }, h('b', {}, 'ویرایش نود'));
  const body = h('div');
  card.append(body);

  // ssh nodes have a few plain fields
  if (n.type === 'ssh') {
    const f = (k, w, ph) => h('input', { class: 'ltr', style: 'width:' + w, placeholder: ph, value: n[k] || '', onchange: e => { n[k] = e.target.value; } });
    body.append(h('div', { class: 'row' }, f('host', '12rem', 'host'), f('port', '5rem', 'port'), f('user', '8rem', 'user'), f('password', '10rem', 'password')));
    card.append(saveBar());
    return card;
  }

  let ob = null, rest = [], frag = null;

  const F = (label, ctl, hint) => h('div', {}, h('label', { class: 'f' }, label), ctl, hint ? h('div', { class: 'hint' }, hint) : null);
  const T = (obj, path, o = {}) => h('input', { class: 'ltr', style: 'width:100%', type: o.num ? 'number' : 'text', placeholder: o.ph || '', value: getp(obj, path) ?? '',
    onchange: e => { const v = e.target.value.trim(); setp(obj, path, (o.num && v !== '') ? +v : v); } });
  const S = (obj, path, opts, after) => {
    const cur = getp(obj, path) ?? '';
    const list = opts.some(([v]) => v === cur) ? opts : [...opts, [cur, cur]];
    return h('select', { style: 'width:100%', onchange: e => { setp(obj, path, e.target.value); if (after) after(); } },
      list.map(([v, t]) => h('option', { value: v, selected: v === cur }, t)));
  };
  const C = (checked, text, onch) => h('label', { style: 'display:flex;gap:.4rem;align-items:center' }, h('input', { type: 'checkbox', checked: !!checked, onchange: e => onch(e.target.checked) }), text);
  const sec = (title, ...kids) => [h('div', { class: 'sect' }, h('div', { class: 'sect-t' }, title), h('div', { class: 'grid' }, ...kids.filter(Boolean)))];

  function draw() {
    body.innerHTML = '';
    const proto = ob.protocol;
    const st = ob.settings || (ob.settings = {});
    const withStream = (proto === 'vless' || proto === 'vmess' || proto === 'trojan');
    const ss = withStream ? (ob.streamSettings || (ob.streamSettings = {})) : null;

    // ---- connection
    const conn = [
      F('نام نود', h('input', { style: 'width:100%', value: n.name || '', onchange: e => { n.name = e.target.value; } })),
      F('پروتکل', h('input', { class: 'ltr', style: 'width:100%', value: proto, disabled: true })),
      F('آدرس سرور', T(st, ['address'], { ph: 'example.com' })),
      F('پورت', T(st, ['port'], { num: true, ph: '443' }))
    ];
    if (proto === 'vless') conn.push(
      F('UUID', T(st, ['id'])),
      F('Encryption', T(st, ['encryption'], { ph: 'none' }), 'معمولاً none'),
      F('Flow', S(st, ['flow'], [['', 'بدون'], ['xtls-rprx-vision', 'xtls-rprx-vision'], ['xtls-rprx-vision-udp443', 'xtls-rprx-vision-udp443']]), 'xtls-rprx-vision فقط با TLS/REALITY روی TCP'));
    if (proto === 'vmess') conn.push(
      F('UUID', T(st, ['id'])),
      F('رمزنگاری', S(st, ['security'], [['auto', 'auto'], ['aes-128-gcm', 'aes-128-gcm'], ['chacha20-poly1305', 'chacha20-poly1305'], ['none', 'none'], ['zero', 'zero']])));
    if (proto === 'trojan') conn.push(
      F('رمز (password)', T(st, ['password'])),
      F('Flow', S(st, ['flow'], [['', 'بدون'], ['xtls-rprx-vision', 'xtls-rprx-vision']])));
    if (proto === 'shadowsocks') conn.push(
      F('روش رمزنگاری', S(st, ['method'], ['aes-128-gcm', 'aes-256-gcm', 'chacha20-ietf-poly1305', 'xchacha20-ietf-poly1305', '2022-blake3-aes-128-gcm', '2022-blake3-aes-256-gcm', '2022-blake3-chacha20-poly1305'].map(x => [x, x]))),
      F('رمز (password)', T(st, ['password'])));
    if (proto === 'socks') conn.push(F('نام کاربری', T(st, ['user'])), F('رمز', T(st, ['pass'])));

function siteOf(h) {

  return h('div', {}, defaultCard(), h('div', { class: 'card' }, h('b', {}, 'سهمیهٔ روزانه برای هر کاربر (دو سقف جدا: لیست سفید و VPN)'),
    h('p', { class: 'hint' }, 'هر کاربر دو شمارندهٔ روزانهٔ جدا دارد: «لیست سفید» = ترافیک مستقیم که وارد تونل نمی‌شود (مقصدهای لیست استثنا، دستگاه/اینترفیس مستقیم) و «VPN» = ترافیکی که از تونل می‌گذرد. وقتی مصرف یک شمارنده به سقفش برسد، فقط سرعت همان بخش به عدد «پس از سقف» کاهش می‌یابد (۰ = قطع کامل). حجم ۰ یا خالی = بدون سقف (فقط شمارش). هر ۲۴ ساعت (طبق ساعت ریست زیر) صفر می‌شود. مصرف هر چند دقیقه روی حافظهٔ فلش ذخیره می‌شود و با ریستارت روتر پاک نمی‌شود (در قطع ناگهانی برق حداکثر چند دقیقهٔ آخر از دست می‌رود). ۱ گیگابایت = ۱۰۲۴ مگابایت.'),
    dl, cfg.quotas.length ? t : h('p', { class: 'hint' }, 'هنوز سهمیه‌ای تعریف نشده است.'),
    h('div', { class: 'row' }, h('button', { class: 'b sec', onclick: () => { cfg.quotas.push({ name: 'user' + (cfg.quotas.length + 1), ip: '', mac: '', wl_mb: '1024', wl_kbps: '128', vpn_mb: '512', vpn_kbps: '64' }); render(); } }, 'افزودن کاربر')),
    h('div', { class: 'grid' }, fld('ساعت ریست روزانه (HH:MM)', 'reset_time', '00:00', { placeholder: '00:00' }), fld('اختلاف ساعت محلی با UTC (دقیقه؛ تهران ۲۱۰)', 'tz_offset', '210'), fld('نگهداری گزارش (روز)', 'acct_days', '7')),
    h('div', { class: 'row' }, h('label', {}, h('input', { type: 'checkbox', checked: M.accounting !== '0', onchange: e => { M.accounting = e.target.checked ? '1' : '0'; } }), ' شمارش مصرف و گزارش (لاگ DNS در RAM نگه داشته می‌شود)')),
    saveBar()));
}

// allowance for everybody without an own quota and not excepted from the default policy
function defaultCard() {
  const M = cfg.main, vpn = M.default_mode === 'vpn';
  const fld = (label, key, ph) => h('div', {}, h('label', { class: 'f' }, label),
    h('input', { class: 'ltr', type: 'number', min: 0, style: 'width:100%', placeholder: ph, value: M[key] || '', onchange: e => { M[key] = e.target.value.trim() || '0'; } }));
  return h('div', { class: 'card' }, h('b', {}, 'سقف پیش‌فرض (برای همهٔ کاربرانی که استثنا نیستند)'),
    h('p', { class: 'hint' }, vpn
      ? 'سیاست پیش‌فرض «همه VPN» است: هر دستگاهی که سهمیهٔ جداگانه ندارد و «مستقیم» (استثنا) نشده، این دو سقف روزانه را می‌گیرد؛ هر دستگاه جدا شمرده می‌شود. دستگاه/اینترفیس مستثنا مشمول سقف پیش‌فرض نیست.'
      : 'سیاست پیش‌فرض «همه مستقیم» است: هر دستگاهی که سهمیهٔ جداگانه ندارد و VPN (استثنا) نگرفته، این سقف روزانه را می‌گیرد؛ هر دستگاه جدا شمرده می‌شود. دستگاه‌هایی که VPN دارند مشمول سقف پیش‌فرض نیستند.'),
    h('p', { class: 'hint' }, 'حجم خالی یا ۰ = بدون سقف پیش‌فرض. سرعت ۰ = قطع کامل پس از سقف. دستگاه تازه‌وارد حداکثر حدود ۳۰ ثانیه بعد مشمول می‌شود (مصرف همان چند ثانیه هم حساب می‌شود).'),
    h('div', { class: 'grid' },
      fld(vpn ? 'لیست سفید: حجم روزانه (MB)' : 'حجم روزانه (MB)', 'def_wl_mb', '0'),
      fld(vpn ? 'لیست سفید: سرعت پس از سقف (kbit/s)' : 'سرعت پس از سقف (kbit/s)', 'def_wl_kbps', '64'),
      vpn ? fld('VPN: حجم روزانه (MB)', 'def_vpn_mb', '0') : null,
      vpn ? fld('VPN: سرعت پس از سقف (kbit/s)', 'def_vpn_kbps', '64') : null),
    saveBar());
}

async function loadLogs() { const l = await xg('logs'); const p = $('#logs'); if (p) p.textContent = `--- xguardd\n${l.xguardd}\n\n--- xray\n${l.xray}\n\n--- ssh\n${l.ssh}`; }
function vLogs(m) { m.append(h('div', { class: 'card' }, h('div', { class: 'row' }, h('button', { class: 'b sec', onclick: loadLogs }, 'تازه‌سازی')), h('pre', { id: 'logs' }, '…'))); loadLogs(); }

// ---- boot ----------------------------------------------------------------
$('#loginbtn').addEventListener('click', async () => {
  try { await login($('#pw').value); $('#login').style.display = 'none'; $('#lerr').textContent = ''; await load(); } catch (e) { $('#lerr').textContent = e.message; }
});
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#loginbtn').click(); });
drawNav();
(async () => { try { await load(); $('#login').style.display = 'none'; } catch (e) { showLogin(); } })();
setInterval(refresh, 5000);
// uhttpd sends no Cache-Control, so after an upgrade a browser can keep showing the old page for hours.
// Compare with what the router serves now (revalidated) and reload once when it differs.
(async () => {
  try {
    if (BUILD.startsWith('__')) return;
    const m = /const BUILD = '([^']+)'/.exec(await (await fetch(location.pathname, { cache: 'no-cache' })).text());
    if (m && m[1] !== BUILD && !sessionStorage.getItem('xg_reload_' + m[1])) { sessionStorage.setItem('xg_reload_' + m[1], '1'); location.reload(); }
  } catch (e) { }
})();
</script>
