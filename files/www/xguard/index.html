<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xguard</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1c2330;--mut:#6b7587;--bd:#dde1e8;--ac:#2563eb;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#10141b;--card:#181e28;--fg:#e6e9ef;--mut:#93a0b4;--bd:#2a3342;--ac:#6b9bff;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,"Segoe UI",Tahoma,sans-serif}
header{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;padding:.8rem 1rem;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
h1{font-size:1.05rem;margin:0}
.pill{padding:.15rem .7rem;border-radius:99px;font-size:.85rem;border:1px solid var(--bd);color:var(--mut)}
.pill.running{color:var(--ok);border-color:var(--ok)}.pill.degraded,.pill.starting,.pill.restarting,.pill.fetching-xray,.pill.updating{color:var(--warn);border-color:var(--warn)}
.pill.disabled{color:var(--mut)}.pill.need-xray,.pill.error,.pill.no-node{color:var(--bad);border-color:var(--bad)}
nav{display:flex;gap:.25rem;padding:.5rem 1rem 0;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);padding:.5rem .8rem;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ac);border-color:var(--ac)}
main{max-width:980px;margin:0 auto;padding:1rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:1rem;margin-bottom:1rem}
.sect{border:1px solid var(--bd);border-radius:10px;padding:.8rem 1rem 1rem;margin:.9rem 0;background:color-mix(in srgb,var(--bg) 55%,var(--card))}
.sect-t{font-weight:600;margin-bottom:.7rem;padding-bottom:.4rem;border-bottom:1px solid var(--bd);color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem}
.k{color:var(--mut);font-size:.8rem}.v{font-size:1.1rem;font-weight:600;direction:ltr;text-align:right;word-break:break-all}
button.b,select,input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:.4rem .6rem}
button.b{cursor:pointer;background:var(--ac);color:#fff;border-color:var(--ac)}button.b.sec{background:none;color:var(--fg);border-color:var(--bd)}button.b.del{background:none;color:var(--bad);border-color:var(--bd)}
textarea{width:100%;min-height:5.5rem;direction:ltr;font-family:ui-monospace,Consolas,monospace;font-size:.85rem}
input.ltr,select.ltr,textarea.ltr{direction:ltr;text-align:left}
table{width:100%;border-collapse:collapse}th,td{padding:.4rem .3rem;border-bottom:1px solid var(--bd);text-align:right;vertical-align:middle}th{color:var(--mut);font-weight:500;font-size:.8rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.4rem 0}
.hint{color:var(--mut);font-size:.82rem}
label.f{display:block;margin:.55rem 0 .15rem;color:var(--mut);font-size:.85rem}
#msg{position:fixed;bottom:1rem;inset-inline:1rem;max-width:560px;margin:auto;padding:.7rem 1rem;border-radius:9px;background:var(--card);border:1px solid var(--bd);display:none;z-index:9}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:20}
pre{direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-all;font-size:.78rem;background:var(--bg);padding:.6rem;border-radius:7px;max-height:22rem;overflow:auto}
.mono{direction:ltr;font-family:ui-monospace,Consolas,monospace;font-size:.85rem}
</style>
</head>
<body>
<div id="login"><div class="card" style="width:min(92vw,340px)">
  <h1>xguard</h1><p class="hint">ورود با رمز root روتر</p>
  <input id="pw" type="password" class="ltr" style="width:100%" placeholder="password (can be empty)" autocomplete="current-password">
  <div class="row"><button class="b" id="loginbtn">ورود</button><span id="lerr" class="hint" style="color:var(--bad)"></span></div>
</div></div>

<header>
  <h1>xguard</h1><span id="pill" class="pill">…</span><span id="hnode" class="hint mono"></span>
  <span style="flex:1"></span>
  <label class="row" style="margin:0"><input type="checkbox" id="enabled"> فعال</label>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="msg"></div>

<script>
'use strict';
const $ = (s, e) => (e || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if (k === 'value') e.value = attrs[k];
    else if (k === 'checked') e.checked = !!attrs[k];
    else if (k === 'selected' || k === 'disabled') e[k] = !!attrs[k];   // setAttribute('selected', false) would still select
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}

// ---- ubus ----------------------------------------------------------------
// opened from LuCI (Services -> xguard VPN): "#sid=<LuCI session>" avoids a second login
try {
  const hm = /^#sid=([0-9a-f]{32})$/.exec(location.hash);
  if (hm) { sessionStorage.setItem('xg_sid', hm[1]); history.replaceState(null, '', location.pathname + location.search); }
} catch (e) {}
let sid = sessionStorage.getItem('xg_sid') || '00000000000000000000000000000000';
async function rpc(obj, method, params) {
  const r = await fetch('/ubus', { method: 'POST', body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'call', params: [sid, obj, method, params || {}] }) });
  const j = await r.json();
  if (j.error) throw new Error(j.error.message);
  const [code, data] = j.result;
  if (code === 6) { showLogin(); throw new Error('access denied'); }
  if (code !== 0) throw new Error('ubus error ' + code);
  return data;
}
const xg = (m, p) => rpc('xguard', m, p);
async function login(pw) {
  const r = await fetch('/ubus', { method: 'POST', body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'call', params: ['00000000000000000000000000000000', 'session', 'login', { username: 'root', password: pw }] }) });
  const j = await r.json();
  if (!j.result || j.result[0] !== 0) throw new Error('رمز اشتباه است');
  sid = j.result[1].ubus_rpc_session; sessionStorage.setItem('xg_sid', sid);
}
function showLogin() { $('#login').style.display = 'flex'; }

let mt;
function say(t, bad) {
  const m = $('#msg'); m.textContent = t; m.style.display = 'block'; m.style.borderColor = bad ? 'var(--bad)' : 'var(--bd)';
  clearTimeout(mt); mt = setTimeout(() => m.style.display = 'none', bad ? 7000 : 3000);
}

// ---- state ----------------------------------------------------------------
let cfg = null, st = null, dev = null, tab = 'status', dirty = false, editing = -1;
const TABS = [['status', 'وضعیت'], ['nodes', 'نودها'], ['net', 'شبکه و دستگاه‌ها'], ['limits', 'محدودیت سرعت'], ['settings', 'تنظیمات'], ['logs', 'لاگ']];
const fmt = n => { n = +n || 0; const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return n.toFixed(i ? 1 : 0) + ' ' + u[i]; };
const kb = n => fmt((+n || 0) * 1024);
const dur = s => { s = +s || 0; const d = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return (d ? d + 'd ' : '') + (hh ? hh + 'h ' : '') + m + 'm'; };
const STATUS_FA = { running: 'متصل', degraded: 'قطع (kill-switch فعال)', starting: 'در حال اتصال', restarting: 'ری‌استارت', disabled: 'غیرفعال', 'fetching-xray': 'دانلود xray', 'need-xray': 'xray موجود نیست', 'no-node': 'نود ندارد', updating: 'به‌روزرسانی xray', error: 'خطا' };

async function load() {
  [cfg, st, dev] = await Promise.all([xg('get_config'), xg('status'), xg('devices')]);
  $('#enabled').checked = cfg.main.enabled === '1';
  editing = -1;
  paintHead(); render();
}
function paintHead() {
  const s = (st.state && st.state.status) || (st.enabled ? 'starting' : 'disabled');
  const p = $('#pill'); p.className = 'pill ' + s; p.textContent = STATUS_FA[s] || s;
  const n = st.nodes.find(x => x.id === (st.state && st.state.node));
  $('#hnode').textContent = n ? n.name : '';
}
async function refresh() {
  try { st = await xg('status'); paintHead(); if (tab === 'status') render(); if (tab === 'logs') loadLogs(); } catch (e) { }
}

async function save(okmsg) {
  try {
    const r = await xg('save_config', { config: cfg });
    if (r.error) { say(r.error, true); return false; }
    dirty = false; say(okmsg || 'ذخیره شد'); await load(); return true;
  } catch (e) { say(e.message, true); return false; }
}
$('#enabled').addEventListener('change', async e => {
  cfg.main.enabled = e.target.checked ? '1' : '0';
  if (e.target.checked && !cfg.nodes.length) { say('ابتدا یک نود اضافه کنید', true); e.target.checked = false; cfg.main.enabled = '0'; return; }
  if (e.target.checked && !protects() && !confirm('هیچ اینترفیس یا دستگاهی روی VPN تنظیم نشده. ادامه می‌دهید؟')) { e.target.checked = false; cfg.main.enabled = '0'; return; }
  await save(e.target.checked ? 'فعال شد (kill-switch برقرار است)' : 'غیرفعال شد');
});

// ---- tabs ----------------------------------------------------------------
function drawNav() {
  const n = $('#nav'); n.innerHTML = '';
  for (const [id, t] of TABS) n.append(h('button', { class: id === tab ? 'on' : '', onclick: () => { tab = id; drawNav(); render(); } }, t));
}
function render() {
  const m = $('#main'); m.innerHTML = '';
  ({ status: vStatus, nodes: vNodes, net: vNet, limits: vLimits, settings: vSettings, logs: vLogs })[tab](m);
}
const saveBar = () => h('div', { class: 'row' }, h('button', { class: 'b', onclick: () => save() }, 'ذخیره و اعمال'));

function vStatus(m) {
  const s = st.state || {};
  if (cfg.main.enabled === '1' && !protects())
    m.append(h('div', { class: 'card', style: 'border-color:var(--bad)' }, h('b', { style: 'color:var(--bad)' }, 'هشدار: هیچ اینترفیسی روی «VPN» نیست'), h('p', { class: 'hint' }, 'برنامه روشن است ولی همهٔ اینترفیس‌ها «دست‌نخورده/مستقیم»اند؛ پس ترافیک هیچ دستگاهی از VPN نمی‌گذرد و با نبودن xray هم قطع نمی‌شود (kill-switch فقط برای اینترفیس‌های VPN و مسدود است). در تب «شبکه» اینترفیس‌های دلخواه را روی VPN بگذارید. فقط DNS روتر از xray می‌گذرد.')));
  const cell = (k, v) => h('div', {}, h('div', { class: 'k' }, k), h('div', { class: 'v' }, v));
  m.append(h('div', { class: 'card' }, h('div', { class: 'grid' },
    cell('وضعیت', STATUS_FA[s.status] || s.status || '—'),
    cell('تأخیر', s.alive === '1' ? s.delay + ' ms' : '—'),
    cell('آپلود / دانلود (از شروع xray)', fmt(s.up_bytes) + ' / ' + fmt(s.down_bytes)),
    cell('مدت اتصال xray', dur(s.uptime)),
    cell('تعداد ری‌استارت', s.restarts || 0),
    cell('RAM پروسهٔ xray', kb(s.rss_kb)),
    cell('RAM در دسترس', kb(st.mem_avail_kb) + ' / ' + kb(st.mem_total_kb)),
    cell('zram swap آزاد', st.swap_total_kb ? kb(st.swap_free_kb) + ' / ' + kb(st.swap_total_kb) : 'غیرفعال'),
    cell('نسخهٔ xray', (s.xray_version || '—').replace(/\s*\(.*$/, '')),
    cell('load', st.loadavg.split(' ').slice(0, 3).join(' '))
  ), s.msg ? h('p', { class: 'hint', style: 'color:var(--warn)' }, s.msg) : null));
  m.append(h('div', { class: 'card' },
    h('div', { class: 'row' },
      h('button', { class: 'b sec', onclick: () => cmd('restart') }, 'ری‌استارت xray'),
      h('button', { class: 'b sec', onclick: () => cmd('next') }, 'نود بعدی'),
      h('button', { class: 'b sec', onclick: () => confirm('xray از منبع تنظیم‌شده دوباره دانلود می‌شود. در این مدت kill-switch فعال می‌ماند.') && cmd('update-xray') }, 'به‌روزرسانی xray')),
    h('p', { class: 'hint' }, 'اگر اتصال قطع شود، دستگاه‌های روی VPN اینترنت مستقیم نخواهند داشت (kill-switch) و برنامه تا بی‌نهایت دوباره تلاش می‌کند.')));
}
async function cmd(c) { try { await xg('command', { cmd: c }); say('دستور ارسال شد'); setTimeout(refresh, 2500); } catch (e) { say(e.message, true); } }

// ---- node editor (form) ----------------------------------------------------------------
const FPS = ['chrome', 'firefox', 'safari', 'ios', 'android', 'edge', '360', 'qq', 'random', 'randomized'];
const getp = (o, p) => p.reduce((a, k) => (a == null ? undefined : a[k]), o);
const setp = (o, p, v) => {
  let a = o;
  for (let i = 0; i < p.length - 1; i++) { if (typeof a[p[i]] !== 'object' || a[p[i]] === null) a[p[i]] = {}; a = a[p[i]]; }
  const k = p[p.length - 1];
  if (v === '' || v === undefined || v === null || v === false) delete a[k]; else a[k] = v;
};
const isFrag = o => o && o.protocol === 'freedom' && o.settings && o.settings.fragment;
const KNOWN = ['vless', 'vmess', 'trojan', 'shadowsocks', 'socks'];
const SECTION_STYLE = 'margin:.9rem 0 .3rem;font-weight:600';

function nodeEditor(n) {
  const card = h('div', { class: 'card' }, h('b', {}, 'ویرایش نود'));
  const body = h('div');
  card.append(body);

  // ssh nodes have a few plain fields
  if (n.type === 'ssh') {
    const f = (k, w, ph) => h('input', { class: 'ltr', style: 'width:' + w, placeholder: ph, value: n[k] || '', onchange: e => { n[k] = e.target.value; } });
    body.append(h('div', { class: 'row' }, f('host', '12rem', 'host'), f('port', '5rem', 'port'), f('user', '8rem', 'user'), f('password', '10rem', 'password')));
    card.append(saveBar());
    return card;
  }

  let ob = null, rest = [], frag = null;

  const F = (label, ctl, hint) => h('div', {}, h('label', { class: 'f' }, label), ctl, hint ? h('div', { class: 'hint' }, hint) : null);
  const T = (obj, path, o = {}) => h('input', { class: 'ltr', style: 'width:100%', type: o.num ? 'number' : 'text', placeholder: o.ph || '', value: getp(obj, path) ?? '',
    onchange: e => { const v = e.target.value.trim(); setp(obj, path, (o.num && v !== '') ? +v : v); } });
  const S = (obj, path, opts, after) => {
    const cur = getp(obj, path) ?? '';
    const list = opts.some(([v]) => v === cur) ? opts : [...opts, [cur, cur]];
    return h('select', { style: 'width:100%', onchange: e => { setp(obj, path, e.target.value); if (after) after(); } },
      list.map(([v, t]) => h('option', { value: v, selected: v === cur }, t)));
  };
  const C = (checked, text, onch) => h('label', { style: 'display:flex;gap:.4rem;align-items:center' }, h('input', { type: 'checkbox', checked: !!checked, onchange: e => onch(e.target.checked) }), text);
  const sec = (title, ...kids) => [h('div', { class: 'sect' }, h('div', { class: 'sect-t' }, title), h('div', { class: 'grid' }, ...kids.filter(Boolean)))];

  function draw() {
    body.innerHTML = '';
    const proto = ob.protocol;
    const st = ob.settings || (ob.settings = {});
    const withStream = (proto === 'vless' || proto === 'vmess' || proto === 'trojan');
    const ss = withStream ? (ob.streamSettings || (ob.streamSettings = {})) : null;

    // ---- connection
    const conn = [
      F('نام نود', h('input', { style: 'width:100%', value: n.name || '', onchange: e => { n.name = e.target.value; } })),
      F('پروتکل', h('input', { class: 'ltr', style: 'width:100%', value: proto, disabled: true })),
      F('آدرس سرور', T(st, ['address'], { ph: 'example.com' })),
      F('پورت', T(st, ['port'], { num: true, ph: '443' }))
    ];
    if (proto === 'vless') conn.push(
      F('UUID', T(st, ['id'])),
      F('Encryption', T(st, ['encryption'], { ph: 'none' }), 'معمولاً none'),
      F('Flow', S(st, ['flow'], [['', 'بدون'], ['xtls-rprx-vision', 'xtls-rprx-vision'], ['xtls-rprx-vision-udp443', 'xtls-rprx-vision-udp443']]), 'xtls-rprx-vision فقط با TLS/REALITY روی TCP'));
    if (proto === 'vmess') conn.push(
      F('UUID', T(st, ['id'])),
      F('رمزنگاری', S(st, ['security'], [['auto', 'auto'], ['aes-128-gcm', 'aes-128-gcm'], ['chacha20-poly1305', 'chacha20-poly1305'], ['none', 'none'], ['zero', 'zero']])));
    if (proto === 'trojan') conn.push(
      F('رمز (password)', T(st, ['password'])),
      F('Flow', S(st, ['flow'], [['', 'بدون'], ['xtls-rprx-vision', 'xtls-rprx-vision']])));
    if (proto === 'shadowsocks') conn.push(
      F('روش رمزنگاری', S(st, ['method'], ['aes-128-gcm', 'aes-256-gcm', 'chacha20-ietf-poly1305', 'xchacha20-ietf-poly1305', '2022-blake3-aes-128-gcm', '2022-blake3-aes-256-gcm', '2022-blake3-chacha20-poly1305'].map(x => [x, x]))),
      F('رمز (password)', T(st, ['password'])));
    if (proto === 'socks') conn.push(F('نام کاربری', T(st, ['user'])), F('رمز', T(st, ['pass'])));
    body.append(...sec('اتصال', ...conn));

    if (!withStream) return drawExtra(null);

    // ---- transport
    const net = ss.network || 'tcp';
    const tr = [F('نوع انتقال (Network)', S(ss, ['network'], [['tcp', 'TCP (raw)'], ['ws', 'WebSocket'], ['grpc', 'gRPC'], ['httpupgrade', 'HTTPUpgrade'], ['xhttp', 'XHTTP'], ['kcp', 'mKCP']], draw))];
    if (net === 'ws') tr.push(F('Path', T(ss, ['wsSettings', 'path'], { ph: '/' })), F('Host', T(ss, ['wsSettings', 'host']), 'خالی = همان SNI/آدرس'));
    if (net === 'httpupgrade') tr.push(F('Path', T(ss, ['httpupgradeSettings', 'path'], { ph: '/' })), F('Host', T(ss, ['httpupgradeSettings', 'host'])));
    if (net === 'xhttp') tr.push(F('Path', T(ss, ['xhttpSettings', 'path'], { ph: '/' })), F('Host', T(ss, ['xhttpSettings', 'host'])),
      F('Mode', S(ss, ['xhttpSettings', 'mode'], [['', 'auto'], ['packet-up', 'packet-up'], ['stream-up', 'stream-up'], ['stream-one', 'stream-one']])));
    if (net === 'grpc') tr.push(F('Service name', T(ss, ['grpcSettings', 'serviceName'])), F('Authority', T(ss, ['grpcSettings', 'authority'])),
      C(getp(ss, ['grpcSettings', 'multiMode']), 'Multi mode', v => setp(ss, ['grpcSettings', 'multiMode'], v)));
    if (net === 'kcp') tr.push(
      F('Header', S(ss, ['kcpSettings', 'header', 'type'], [['none', 'none'], ['srtp', 'srtp'], ['utp', 'utp'], ['wechat-video', 'wechat-video'], ['dtls', 'dtls'], ['wireguard', 'wireguard']])),
      F('Seed', T(ss, ['kcpSettings', 'seed'])),
      F('MTU', T(ss, ['kcpSettings', 'mtu'], { num: true, ph: '1350' }), '۵۷۶ تا ۱۴۶۰'),
      F('TTI (ms)', T(ss, ['kcpSettings', 'tti'], { num: true, ph: '50' }), '۱۰ تا ۱۰۰'),
      C(getp(ss, ['kcpSettings', 'congestion']), 'Congestion control', v => setp(ss, ['kcpSettings', 'congestion'], v)));
    body.append(...sec('انتقال (Transport)', ...tr));

    // ---- security
    const secv = ss.security || 'none';
    const se = [F('امنیت', S(ss, ['security'], [['none', 'none'], ['tls', 'TLS'], ['reality', 'REALITY']], () => {
      const v = ss.security;
      if (v === 'tls' && !ss.tlsSettings) ss.tlsSettings = { fingerprint: 'chrome' };
      if (v === 'reality' && !ss.realitySettings) ss.realitySettings = { fingerprint: 'chrome', serverName: '', publicKey: '', shortId: '' };
      draw();
    }))];
    const fpSel = key => F('Fingerprint (uTLS)', S(ss, [key, 'fingerprint'], [['', 'پیش‌فرض (بدون uTLS)'], ...FPS.map(x => [x, x])]), 'مرورگری که TLS آن تقلید می‌شود');
    if (secv === 'tls') {
      const alpn = getp(ss, ['tlsSettings', 'alpn']) || [];
      se.push(F('SNI (serverName)', T(ss, ['tlsSettings', 'serverName'])), fpSel('tlsSettings'),
        F('ALPN', h('div', { class: 'row' }, ['h2', 'http/1.1', 'h3'].map(a => C(alpn.includes(a), a, v => {
          const cur = (getp(ss, ['tlsSettings', 'alpn']) || []).filter(x => x !== a); if (v) cur.push(a);
          setp(ss, ['tlsSettings', 'alpn'], cur.length ? cur : '');
        })))),
        C(getp(ss, ['tlsSettings', 'allowInsecure']), 'allowInsecure (تأیید نکردن گواهی — ناامن)', v => setp(ss, ['tlsSettings', 'allowInsecure'], v)));
    }
    if (secv === 'reality') {
      se.push(F('SNI (serverName)', T(ss, ['realitySettings', 'serverName'])), fpSel('realitySettings'),
        F('Public key', T(ss, ['realitySettings', 'publicKey'])), F('Short ID', T(ss, ['realitySettings', 'shortId'])),
        F('SpiderX', T(ss, ['realitySettings', 'spiderX'], { ph: '/' })));
    }
    body.append(...sec('امنیت (Security)', ...se));

    drawExtra(ss);
  }

  function drawExtra(ss) {
    const ex = [];
    // fragment: an extra freedom hop that the main outbound dials through
    ex.push(C(!!frag, 'Fragment (تکه‌تکه کردن TLS hello برای دور زدن فیلتر)', v => {
      frag = v ? { protocol: 'freedom', settings: { fragment: { packets: 'tlshello', length: '100-200', interval: '10-20' } } } : null; draw();
    }));
    if (frag) {
      const fg = frag.settings.fragment;
      ex.push(F('Packets', S(fg, ['packets'], [['tlshello', 'tlshello'], ['1-3', '1-3'], ['1-5', '1-5'], ['1-1', '1-1']])),
        F('Length (بایت)', T(fg, ['length'], { ph: '100-200' }), 'مثلاً ۱۰۰-۲۰۰ یا ۱۰-۳۰'),
        F('Interval (ms)', T(fg, ['interval'], { ph: '10-20' }), 'مثلاً ۱۰-۲۰'));
    }
    ex.push(C(ob.mux && ob.mux.enabled, 'Mux (چند اتصال روی یک ارتباط)', v => { if (v) ob.mux = { enabled: true, concurrency: (ob.mux && ob.mux.concurrency) || 8 }; else delete ob.mux; draw(); }));
    if (ob.mux && ob.mux.enabled) ex.push(F('Mux concurrency', T(ob.mux, ['concurrency'], { num: true, ph: '8' })));
    if (ss) ex.push(C(getp(ss, ['sockopt', 'tcpFastOpen']), 'TCP Fast Open', v => setp(ss, ['sockopt', 'tcpFastOpen'], v)));
    body.append(...sec('پیشرفته', ...ex));
  }

  function rawFallback(chain) {
    body.append(h('p', { class: 'hint' }, 'این پروتکل فرم گرافیکی ندارد؛ JSON خام xray را ویرایش کنید.'),
      h('textarea', { class: 'ltr', style: 'min-height:16rem;font-family:monospace', onchange: e => { n.json = e.target.value; n.type = 'json'; } }, JSON.stringify(chain.length === 1 ? chain[0] : chain, null, 2)));
    n.json = JSON.stringify(chain.length === 1 ? chain[0] : chain); n.type = 'json';
  }

  (async () => {
    body.append(h('p', { class: 'hint' }, 'در حال خواندن…'));
    let chain;
    try {
      if (n.type === 'link') {
        const r = await xg('link_to_json', { link: n.link || '' });
        if (r.error) throw new Error(r.error);
        chain = JSON.parse(r.json);
      } else chain = JSON.parse(n.json);
    } catch (e) { body.innerHTML = ''; body.append(h('p', { class: 'hint', style: 'color:var(--bad)' }, 'خواندن نود ناموفق بود: ' + e.message)); return; }
    chain = Array.isArray(chain) ? chain : [chain];
    body.innerHTML = '';
    if (!KNOWN.includes(chain[0].protocol)) { rawFallback(chain); return; }
    ob = chain[0];
    frag = chain.slice(1).find(isFrag) || null;
    rest = chain.slice(1).filter(o => !isFrag(o));
    draw();
  })();

  card.append(h('div', { class: 'row', style: 'margin-top:1rem' },
    h('button', { class: 'b', onclick: async () => {
      if (ob) {
        const chain = [ob, ...(frag ? [frag] : []), ...rest];
        n.type = 'json'; n.json = JSON.stringify(chain.length === 1 ? chain[0] : chain); n.link = '';
      }
      await save('نود ذخیره شد');
    } }, 'ذخیرهٔ نود'),
    h('button', { class: 'b sec', onclick: () => { editing = -1; render(); } }, 'انصراف'),
    h('span', { class: 'hint' }, 'پس از ذخیره، نود با همین تنظیمات (به‌جای لینک اصلی) نگه داشته می‌شود.')));
  return card;
}
